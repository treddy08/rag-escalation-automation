---
# =============================================================================
# Namespace Configuration
# =============================================================================
ocp4_workload_rag_escalation_workbench_namespace: ""

# =============================================================================
# Tenant Label Configuration
# =============================================================================
ocp4_workload_rag_escalation_workbench_tenant_label: ""

# =============================================================================
# Git Repository Configuration
# =============================================================================
ocp4_workload_rag_escalation_workbench_git_repo: "https://github.com/FrankLaVigne/EscalationLab"
ocp4_workload_rag_escalation_workbench_git_branch: "main"

# =============================================================================
# Notebook Image Configuration
# =============================================================================
# RHOAI Training Hub image with CUDA, PyTorch, Python 3.12
ocp4_workload_rag_escalation_workbench_notebook_image: "image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/training-hub-universal-cuda:3.4"

# Alternative images from cluster:
# PyTorch LLM Compressor: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/jupyter-pytorch-llmcompressor:3.4
# Minimal GPU: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/minimal-gpu:1.2

# =============================================================================
# Storage Configuration
# =============================================================================
ocp4_workload_rag_escalation_workbench_storage_size: 20Gi

# =============================================================================
# Resource Configuration
# =============================================================================
ocp4_workload_rag_escalation_workbench_cpu_request: "2"
ocp4_workload_rag_escalation_workbench_cpu_limit: "8"
ocp4_workload_rag_escalation_workbench_memory_request: 10Gi
ocp4_workload_rag_escalation_workbench_memory_limit: 14Gi
ocp4_workload_rag_escalation_workbench_gpu_count: "1"

# =============================================================================
# Additional Python Packages (optional)
# =============================================================================
ocp4_workload_rag_escalation_workbench_pip_packages: []

# =============================================================================
# Workload Control
# =============================================================================
ocp4_workload_rag_escalation_workbench_ready_timeout: 600
ocp4_workload_rag_escalation_workbench_export_user_data: true
