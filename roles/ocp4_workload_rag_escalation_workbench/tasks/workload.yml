---
# Validate required variables
- name: Validate required variables are defined
  assert:
    that:
    - ocp4_workload_rag_escalation_workbench_namespace is defined
    - ocp4_workload_rag_escalation_workbench_namespace | length > 0
    - ocp4_workload_rag_escalation_workbench_git_repo is defined
    - ocp4_workload_rag_escalation_workbench_git_repo | length > 0
    - ocp4_workload_rag_escalation_workbench_tenant_label is defined
    - ocp4_workload_rag_escalation_workbench_tenant_label | length > 0
    fail_msg: "Required variables must be set: namespace, git_repo, tenant_label"

# Get cluster ingress domain
- name: Get cluster ingress domain
  kubernetes.core.k8s_info:
    api_version: config.openshift.io/v1
    kind: Ingress
    name: cluster
  register: r_ingress

- name: Set ingress domain fact
  set_fact:
    openshift_cluster_ingress_domain: "{{ r_ingress.resources[0].spec.domain }}"
  when:
  - r_ingress.resources | length > 0
  - openshift_cluster_ingress_domain is not defined

# Create resources
- name: Create PVC for workbench storage
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'pvc.yml.j2') | from_yaml }}"

- name: Create Jupyter workbench with git repo pre-loaded
  kubernetes.core.k8s:
    state: present
    definition: "{{ lookup('template', 'notebook.yml.j2') | from_yaml }}"

# Export user data
- name: Set workbench URL
  set_fact:
    ocp4_workload_rag_escalation_workbench_url: >-
      https://rh-ai.{{ openshift_cluster_ingress_domain }}/notebook/{{ ocp4_workload_rag_escalation_workbench_namespace }}/rag-escalation-workbench

- name: Export workbench URL to user data
  agnosticd.core.agnosticd_user_info:
    data:
      rag_escalation_workbench_url: "{{ ocp4_workload_rag_escalation_workbench_url }}"
      rag_escalation_workbench_namespace: "{{ ocp4_workload_rag_escalation_workbench_namespace }}"
      rag_escalation_git_repo: "{{ ocp4_workload_rag_escalation_workbench_git_repo }}"
  when: ocp4_workload_rag_escalation_workbench_export_user_data | bool
