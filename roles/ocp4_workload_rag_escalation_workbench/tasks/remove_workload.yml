---
- name: Remove Jupyter workbench
  kubernetes.core.k8s:
    state: absent
    api_version: kubeflow.org/v1
    kind: Notebook
    name: rag-escalation-workbench
    namespace: "{{ ocp4_workload_rag_escalation_workbench_namespace }}"

- name: Wait for Notebook to be deleted
  kubernetes.core.k8s_info:
    api_version: kubeflow.org/v1
    kind: Notebook
    name: rag-escalation-workbench
    namespace: "{{ ocp4_workload_rag_escalation_workbench_namespace }}"
  register: r_notebook_deleted
  until: r_notebook_deleted.resources | length == 0
  retries: 30
  delay: 10
  failed_when: false

- name: Remove workbench PVC
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: PersistentVolumeClaim
    name: rag-escalation-workbench-pvc
    namespace: "{{ ocp4_workload_rag_escalation_workbench_namespace }}"

- name: Wait for PVC to be deleted
  kubernetes.core.k8s_info:
    api_version: v1
    kind: PersistentVolumeClaim
    name: rag-escalation-workbench-pvc
    namespace: "{{ ocp4_workload_rag_escalation_workbench_namespace }}"
  register: r_pvc_deleted
  until: r_pvc_deleted.resources | length == 0
  retries: 30
  delay: 10
  failed_when: false

- name: Log removal completion
  debug:
    msg: "RAG Escalation workbench removal complete"
